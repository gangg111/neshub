# NES Hub: one APK, several cartridges (see tools/build_native.sh, game.h "hub").
#   games = plug-ins app/src/main/cpp/games/<id>.c linked together; ROM of each in
#           app/src/main/assets/games/<id>.nes; the hub menu (assets/hub/menu.html) lists them
#   apk   = file name the signed APK gets in /sdcard/Download
#   key   = signing key ~/.android/<key>-release.jks
#   appid = Android application id
#   local.conf (not in git) may override apk / key / appid for a private build
game=contraforce
games=chipndale contra contraforce kickmaster tomjerry irontank micromachines duckhunt tinytoon tinytoon2 ducktales2 monsterpocket
apk=neshub-open.apk
key=neshub-open
appid=com.dklab.neshub.open
